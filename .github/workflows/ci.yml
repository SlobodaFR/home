name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format

      - name: Lint (ESLint)
        run: npm run lint


      - name: Build
        run: npm run build -ws --if-present

      - name: Test
        run: npm test
