name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SONAR_TOKEN: op://TECH/thomassloboda_home_secrets/SONAR_TOKEN

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build -ws --if-present

      - name: Test with coverage
        run: npm run test:coverage

      - name: Mutation testing (Stryker)
        run: npm run mutation

      - name: Format mutation report for PR comment
        if: always() && github.event_name == 'pull_request'
        run: node scripts/mutation-report-to-markdown.mjs packages/auth/reports/mutation/mutation.json > mutation-summary.md

      - name: Post mutation report comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: stryker-mutation-report
          path: mutation-summary.md

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
